[project]
name = "fitness-backend"
version = "0.1.0"
description = "Plain-text fitness log backend: FastAPI + JSONL-in-git + MCP"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "bcrypt>=4.1",
    "itsdangerous>=2.2",
    "fastmcp>=2.3",
]

[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.uv]
package = false
