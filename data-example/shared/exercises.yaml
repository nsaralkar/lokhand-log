# Canonical exercise library: a mapping of exercise id -> attributes.
# primary/secondary must be one of:
# chest back shoulders biceps triceps quads hamstrings glutes calves core

chest_press_db_incline:
  name: Chest Press, Incline, DB
  equipment: dumbbell
  primary: chest
  secondary:
  - triceps
  - shoulders
  default_rest_s: 120
  notes: |-
    Bench at 30°. Retract the shoulder blades and keep them pinned.
    Lower to a light stretch, drive the dumbbells up and slightly together.
goblet_squat_db:
  name: Goblet Squat, DB
  equipment: dumbbell
  primary: quads
  secondary:
  - glutes
  - core
  default_rest_s: 150
  notes: Hold the bell against the chest, elbows inside the knees at the bottom.
row_1arm_db:
  name: One-Arm Row, DB
  equipment: dumbbell
  primary: back
  secondary:
  - biceps
  default_rest_s: 90
lateral_raise_db:
  name: Lateral Raise, DB
  equipment: dumbbell
  primary: shoulders
  default_rest_s: 60
pullup:
  name: Pull-Up
  equipment: bodyweight
  primary: back
  secondary:
  - biceps
  - core
  default_rest_s: 150
  notes: Dead hang to chin over the bar. Add weight on a belt once you clear 10 clean reps.
rdl_db:
  name: Romanian Deadlift, DB
  equipment: dumbbell
  primary: hamstrings
  secondary:
  - glutes
  - back
  default_rest_s: 150
