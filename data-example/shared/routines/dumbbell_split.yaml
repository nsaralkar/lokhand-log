# A routine is one training program with multiple days. Start a session from a
# day (the UI lists days under the routine heading). Every block is an
# `exercises` list run for `rounds` rounds — one exercise is a straight block,
# more than one is a superset/circuit. `label` is optional. If this file has no
# top-level `name`, its filename is used instead.
name: Dumbbell Split
days:
  - name: Push Day
    blocks:
      - exercises: [chest_press_db_incline]
        rounds: 3
      - label: shoulder finisher
        rounds: 3
        exercises: [lateral_raise_db, pullup]
  - name: Lower Day
    blocks:
      - exercises: [goblet_squat_db]
        rounds: 3
      - exercises: [rdl_db]
        rounds: 3
      - exercises: [row_1arm_db]
        rounds: 3
